[project]
name = "hr-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuri Di Biasi", email = "yuridibiasi@hotmail.it" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hr-copilot = "hr_copilot:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast, no external services",
    "integration: requires Docker services (postgres/redis)",
    "e2e: requires a running API server",
]

